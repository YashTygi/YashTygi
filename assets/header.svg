<svg xmlns="http://www.w3.org/2000/svg" width="800" height="410" viewBox="0 0 800 410">
<style>
:root{--bg:#f7f3eb;--paper:#f9f7ef;--deep:#ede7dd;--ink:#19120e;--soft:#524c47;--faint:#68625c;--rule:#cac3ba;--hl:#ffe46e;--sage:#94b594;--dusty:#6e99b2;--red:#a45a4e;--coffee:#634632;--shadow:rgba(60,40,20,.14)}
@media (prefers-color-scheme:dark){:root{--bg:#14110e;--paper:#1e1a16;--deep:#28231f;--ink:#e8e4dd;--soft:#a8a49e;--faint:#75716b;--rule:#423c37;--hl:#9e8400;--sage:#6c926c;--dusty:#417c9d;--red:#c67164;--coffee:#80624d;--shadow:rgba(0,0,0,.45)}}
.serif{font-family:Fraunces,'Cormorant Garamond',Georgia,serif;fill:var(--ink)} .hand{font-family:Caveat,'Bradley Hand','Segoe Print','Comic Sans MS',cursive;fill:var(--red)}
.mono{font-family:'JetBrains Mono','SF Mono',Consolas,'Courier New',monospace;fill:var(--faint);letter-spacing:.12em;text-transform:uppercase}
.type{font-family:'Special Elite','Courier New',monospace;fill:var(--ink)} .soft{fill:var(--soft)} .faint{fill:var(--faint)}
</style><rect width="800" height="410" fill="var(--bg)"/><text x="24" y="44" class="serif" font-size="30" >Yash Tyagi</text><text x="24" y="66" class="hand" font-size="17" style="fill:var(--faint);text-decoration:line-through">a portfolio,</text><text x="118" y="66" class="hand" font-size="17" style="fill:var(--faint)">a notebook, mostly.</text><text x="776" y="50" class="mono" font-size="10.5" text-anchor="end">VOL. 01</text><rect x="24" y="82" width="69.0" height="30" rx="3" fill="var(--paper)" stroke="var(--rule)"/><text x="58.5" y="102" class="mono" font-size="10.5" text-anchor="middle">INDEX</text><rect x="101.0" y="86" width="93.6" height="26" rx="3" fill="var(--deep)" stroke="var(--rule)"/><text x="147.8" y="102" class="mono" font-size="10.5" text-anchor="middle">BUILDING</text><rect x="202.6" y="86" width="85.39999999999999" height="26" rx="3" fill="var(--deep)" stroke="var(--rule)"/><text x="245.29999999999998" y="102" class="mono" font-size="10.5" text-anchor="middle">READING</text><rect x="296.0" y="86" width="208.39999999999998" height="26" rx="3" fill="var(--deep)" stroke="var(--rule)"/><text x="400.2" y="102" class="mono" font-size="10.5" text-anchor="middle">SKETCHES &amp; COLLECTIONS</text><rect x="512.4" y="86" width="52.599999999999994" height="26" rx="3" fill="var(--deep)" stroke="var(--rule)"/><text x="538.6999999999999" y="102" class="mono" font-size="10.5" text-anchor="middle">NOW</text><rect x="573.0" y="86" width="69.0" height="26" rx="3" fill="var(--deep)" stroke="var(--rule)"/><text x="607.5" y="102" class="mono" font-size="10.5" text-anchor="middle">HELLO</text><line x1="24" y1="112" x2="776" y2="112" stroke="var(--rule)"/><text x="24" y="152" class="mono" font-size="10.5" >SPREAD 01 · TODAY</text><text x="24" y="200" class="serif" font-size="44" font-weight="500" textLength="98" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Most</text><rect x="143" y="166" width="196" height="40" fill="var(--hl)" opacity=".85" transform="rotate(-.6 143 166)"/><text x="146" y="200" class="serif" font-size="44" font-weight="500" textLength="190" lengthAdjust="spacingAndGlyphs" xml:space="preserve">engineers</text><text x="360" y="200" class="serif" font-size="44" font-weight="500" textLength="250" lengthAdjust="spacingAndGlyphs" xml:space="preserve">optimize for</text><text x="24" y="250" class="serif" font-size="44" font-weight="500" textLength="226" lengthAdjust="spacingAndGlyphs" xml:space="preserve">code. Most</text><rect x="271" y="216" width="86" height="40" fill="var(--hl)" opacity=".85" transform="rotate(-.6 271 216)"/><text x="274" y="250" class="serif" font-size="44" font-weight="500" textLength="80" lengthAdjust="spacingAndGlyphs" xml:space="preserve">PMs</text><text x="378" y="250" class="serif" font-size="44" font-weight="500" textLength="250" lengthAdjust="spacingAndGlyphs" xml:space="preserve">optimize for</text><text x="24" y="300" class="serif" font-size="44" font-weight="500" textLength="216" lengthAdjust="spacingAndGlyphs">outcomes.</text><text x="256" y="300" class="hand" font-size="40" textLength="500" lengthAdjust="spacingAndGlyphs">— I enjoy working where</text><text x="24" y="350" class="hand" font-size="40" textLength="300" lengthAdjust="spacingAndGlyphs">those two meet.</text><path d="M24 384 q5 -6 10 0 t10 0 q5 -6 10 0 t10 0 q5 -6 10 0 t10 0 q5 -6 10 0 t10 0" fill="none" stroke="var(--faint)" stroke-width="1.2"/><text x="120" y="388" class="type" font-size="11" style="fill:var(--faint)">scroll like you'd flip a page.</text></svg>