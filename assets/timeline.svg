<svg xmlns="http://www.w3.org/2000/svg" width="800" height="432" viewBox="0 0 800 432">
<style>
:root{--bg:#f7f3eb;--paper:#f9f7ef;--deep:#ede7dd;--ink:#19120e;--soft:#524c47;--faint:#68625c;--rule:#cac3ba;--hl:#ffe46e;--sage:#94b594;--dusty:#6e99b2;--red:#a45a4e;--coffee:#634632;--shadow:rgba(60,40,20,.14)}
@media (prefers-color-scheme:dark){:root{--bg:#14110e;--paper:#1e1a16;--deep:#28231f;--ink:#e8e4dd;--soft:#a8a49e;--faint:#75716b;--rule:#423c37;--hl:#9e8400;--sage:#6c926c;--dusty:#417c9d;--red:#c67164;--coffee:#80624d;--shadow:rgba(0,0,0,.45)}}
.serif{font-family:Fraunces,'Cormorant Garamond',Georgia,serif;fill:var(--ink)} .hand{font-family:Caveat,'Bradley Hand','Segoe Print','Comic Sans MS',cursive;fill:var(--red)}
.mono{font-family:'JetBrains Mono','SF Mono',Consolas,'Courier New',monospace;fill:var(--faint);letter-spacing:.12em;text-transform:uppercase}
.type{font-family:'Special Elite','Courier New',monospace;fill:var(--ink)} .soft{fill:var(--soft)} .faint{fill:var(--faint)}
</style><rect width="800" height="432" fill="var(--bg)"/><text x="24" y="36" class="mono" font-size="10.5" >SPREAD · EXPERIENCE</text><text x="24" y="72" class="hand" font-size="30" >a rough timeline of how I got here.</text><line x1="130" y1="96" x2="130" y2="402" stroke="var(--rule)" stroke-width="1.5" stroke-dasharray="4 3"/><text x="112" y="120" class="mono" font-size="11" text-anchor="end">2019</text><circle cx="130" cy="116" r="6" fill="var(--paper)" stroke="var(--red)" stroke-width="1.6"/><text x="152" y="121" class="serif" font-size="15.5" >first commit. did not know what main was.</text><text x="112" y="160" class="mono" font-size="11" text-anchor="end">2021</text><circle cx="130" cy="156" r="6" fill="var(--paper)" stroke="var(--red)" stroke-width="1.6"/><text x="152" y="161" class="serif" font-size="15.5" >started B.Tech at MSIT. minor in AI, eventually.</text><text x="112" y="200" class="mono" font-size="11" text-anchor="end">DEC 2024</text><circle cx="130" cy="196" r="6" fill="var(--paper)" stroke="var(--red)" stroke-width="1.6"/><text x="152" y="201" class="serif" font-size="15.5" >joined Pazy as a frontend intern in Bengaluru.</text><text x="112" y="240" class="mono" font-size="11" text-anchor="end">MAY 2025</text><circle cx="130" cy="236" r="6" fill="var(--paper)" stroke="var(--red)" stroke-width="1.6"/><text x="152" y="241" class="serif" font-size="15.5" >finished B.Tech at MSIT. research paper published.</text><text x="112" y="280" class="mono" font-size="11" text-anchor="end">JUN 2025</text><circle cx="130" cy="276" r="6" fill="var(--paper)" stroke="var(--red)" stroke-width="1.6"/><text x="152" y="281" class="serif" font-size="15.5" >promoted to SDE at Pazy. shipped UTR reconciliation.</text><text x="112" y="320" class="mono" font-size="11" text-anchor="end">AUG 2025</text><circle cx="130" cy="316" r="6" fill="var(--paper)" stroke="var(--red)" stroke-width="1.6"/><text x="152" y="321" class="serif" font-size="15.5" >joined Bookswagon. inherited a 1.8★ WebView app.</text><text x="112" y="360" class="mono" font-size="11" text-anchor="end">JAN 2026</text><circle cx="130" cy="356" r="6" fill="var(--paper)" stroke="var(--red)" stroke-width="1.6"/><text x="152" y="361" class="serif" font-size="15.5" >Flutter rebuild live. 3.4 → 58 orders/day in eight weeks.</text><text x="112" y="400" class="mono" font-size="11" text-anchor="end">NOW</text><circle cx="130" cy="396" r="6" fill="var(--red)" stroke="var(--red)" stroke-width="1.6"/><text x="152" y="401" class="hand" font-size="17" style="fill:var(--red)">Next.js migration + GraphQL BFF. still being written.</text></svg>