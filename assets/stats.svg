ht="500" style="fill:var(--dusty)">35%</text><text x="496" y="158" class="serif" font-size="15" text-anchor="middle">Core Web Vitals</text><text x="496" y="182" class="hand" font-size="17" text-anchor="middle" style="fill:var(--faint)">Bookswagon web</text><g transform="rotate(1.2 688.0 131.0)"><rect x="603" y="61" width="176" height="150" rx="3" fill="var(--shadow)"/><rect x="600" y="56" width="176" height="150" rx="3" fill="var(--paper)" stroke="var(--rule)"/></g><circle cx="690" cy="60" r="9" fill="var(--shadow)"/><circle cx="688" cy="56" r="9" fill="#b3372b"/><circle cx="685" cy="53" r="3" fill="#e8776b" opacity=".8"/><text x="688" y="128" class="serif" font-size="46" text-anchor="middle" font-weight="500" style="fill:var(--coffee)">~40%</text><text x="688" y="158" class="serif" font-size="15" text-anchor="middle">page-load cut</text><text x="688" y="182" class="hand" font-size="17" text-anchor="middle" style="fill:var(--faint)">Next.js migration</text></svg>