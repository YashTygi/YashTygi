<svg xmlns="http://www.w3.org/2000/svg" width="800" height="278" viewBox="0 0 800 278">
<style>
:root{--bg:#f7f3eb;--paper:#f9f7ef;--deep:#ede7dd;--ink:#19120e;--soft:#524c47;--faint:#68625c;--rule:#cac3ba;--hl:#ffe46e;--sage:#94b594;--dusty:#6e99b2;--red:#a45a4e;--coffee:#634632;--shadow:rgba(60,40,20,.14)}
@media (prefers-color-scheme:dark){:root{--bg:#14110e;--paper:#1e1a16;--deep:#28231f;--ink:#e8e4dd;--soft:#a8a49e;--faint:#75716b;--rule:#423c37;--hl:#9e8400;--sage:#6c926c;--dusty:#417c9d;--red:#c67164;--coffee:#80624d;--shadow:rgba(0,0,0,.45)}}
.serif{font-family:Fraunces,'Cormorant Garamond',Georgia,serif;fill:var(--ink)} .hand{font-family:Caveat,'Bradley Hand','Segoe Print','Comic Sans MS',cursive;fill:var(--red)}
.mono{font-family:'JetBrains Mono','SF Mono',Consolas,'Courier New',monospace;fill:var(--faint);letter-spacing:.12em;text-transform:uppercase}
.type{font-family:'Special Elite','Courier New',monospace;fill:var(--ink)} .soft{fill:var(--soft)} .faint{fill:var(--faint)}
</style><rect width="800" height="278" fill="var(--bg)"/><g transform="rotate(0 400.0 139.0)"><rect x="27" y="29" width="752" height="230" rx="3" fill="var(--shadow)"/><rect x="24" y="24" width="752" height="230" rx="3" fill="var(--paper)" stroke="var(--rule)"/></g><circle cx="62" cy="28" r="9" fill="var(--shadow)"/><circle cx="60" cy="24" r="9" fill="#b3372b"/><circle cx="57" cy="21" r="3" fill="#e8776b" opacity=".8"/><rect x="24" y="24" width="6" height="230" fill="var(--red)"/><text x="60" y="70" class="mono" font-size="10.5" >BOOKSWAGON APP · AUG 2025 → NOW</text><text x="60" y="108" class="serif" font-size="27" font-weight="500">Bookswagon — WebView to Flutter</text><text x="740" y="108" class="hand" font-size="20" text-anchor="end">/ SHIPPED</text><text x="60" y="140" class="serif" font-size="14.5" >The old app was a .NET WebView wrapper: 3.4 orders a day, ~1.8★. I owned the</text><text x="60" y="162" class="serif" font-size="14.5" >Flutter rebuild — Figma, onboarding UX, HTTP caching, performance, deploys.</text><text x="60" y="184" class="serif" font-size="14.5" >In 8 weeks: 17× daily orders, MAU 4.7K → 9.4K, ~11.6% session-to-purchase,</text><text x="60" y="206" class="serif" font-size="14.5" >&lt;0.04% crash rate. Real users, smooth experience, where there was frustration.</text><path d="M60 236 q5 -6 10 0 t10 0 q5 -6 10 0 t10 0 q5 -6 10 0 t10 0 q5 -6 10 0 t10 0 q5 -6 10 0 t10 0" fill="none" stroke="var(--faint)" stroke-width="1.2"/><text x="172" y="240" class="hand" font-size="18" >the rebuild, week one.</text></svg>