<svg xmlns="http://www.w3.org/2000/svg" width="800" height="272" viewBox="0 0 800 272">
<style>
:root{--bg:#f7f3eb;--paper:#f9f7ef;--deep:#ede7dd;--ink:#19120e;--soft:#524c47;--faint:#68625c;--rule:#cac3ba;--hl:#ffe46e;--sage:#94b594;--dusty:#6e99b2;--red:#a45a4e;--coffee:#634632;--shadow:rgba(60,40,20,.14)}
@media (prefers-color-scheme:dark){:root{--bg:#14110e;--paper:#1e1a16;--deep:#28231f;--ink:#e8e4dd;--soft:#a8a49e;--faint:#75716b;--rule:#423c37;--hl:#9e8400;--sage:#6c926c;--dusty:#417c9d;--red:#c67164;--coffee:#80624d;--shadow:rgba(0,0,0,.45)}}
.serif{font-family:Fraunces,'Cormorant Garamond',Georgia,serif;fill:var(--ink)} .hand{font-family:Caveat,'Bradley Hand','Segoe Print','Comic Sans MS',cursive;fill:var(--red)}
.mono{font-family:'JetBrains Mono','SF Mono',Consolas,'Courier New',monospace;fill:var(--faint);letter-spacing:.12em;text-transform:uppercase}
.type{font-family:'Special Elite','Courier New',monospace;fill:var(--ink)} .soft{fill:var(--soft)} .faint{fill:var(--faint)}
</style><rect width="800" height="272" fill="var(--bg)"/><g transform="rotate(0.2 400.0 119.0)"><rect x="27" y="29" width="752" height="190" rx="3" fill="var(--shadow)"/><rect x="24" y="24" width="752" height="190" rx="3" fill="var(--paper)" stroke="var(--rule)"/></g><circle cx="402" cy="28" r="9" fill="var(--shadow)"/><circle cx="400" cy="24" r="9" fill="#b3372b"/><circle cx="397" cy="21" r="3" fill="#e8776b" opacity=".8"/><text x="400" y="76" class="mono" font-size="10.5" text-anchor="middle">THE OLDEST WAY STILL WORKS BEST</text><text x="400" y="128" class="serif" font-size="46" text-anchor="middle" font-weight="500">say hello.</text><text x="400" y="158" class="serif soft" font-size="16" text-anchor="middle">I read everything, reply slowly, but I reply.</text><rect x="262" y="174" width="276" height="26" fill="var(--hl)" opacity=".85" transform="rotate(-.6 262 174)"/><text x="400" y="193" class="type" font-size="16" text-anchor="middle">tygi.yash@gmail.com</text><text x="400" y="250" class="mono" font-size="10" text-anchor="middle">73 fragments and counting · kept by Yash Tyagi · Delhi</text></svg>