<svg xmlns="http://www.w3.org/2000/svg" width="800" height="350" viewBox="0 0 800 350">
<style>
:root{--bg:#f7f3eb;--paper:#f9f7ef;--deep:#ede7dd;--ink:#19120e;--soft:#524c47;--faint:#68625c;--rule:#cac3ba;--hl:#ffe46e;--sage:#94b594;--dusty:#6e99b2;--red:#a45a4e;--coffee:#634632;--shadow:rgba(60,40,20,.14)}
@media (prefers-color-scheme:dark){:root{--bg:#14110e;--paper:#1e1a16;--deep:#28231f;--ink:#e8e4dd;--soft:#a8a49e;--faint:#75716b;--rule:#423c37;--hl:#9e8400;--sage:#6c926c;--dusty:#417c9d;--red:#c67164;--coffee:#80624d;--shadow:rgba(0,0,0,.45)}}
.serif{font-family:Fraunces,'Cormorant Garamond',Georgia,serif;fill:var(--ink)} .hand{font-family:Caveat,'Bradley Hand','Segoe Print','Comic Sans MS',cursive;fill:var(--red)}
.mono{font-family:'JetBrains Mono','SF Mono',Consolas,'Courier New',monospace;fill:var(--faint);letter-spacing:.12em;text-transform:uppercase}
.type{font-family:'Special Elite','Courier New',monospace;fill:var(--ink)} .soft{fill:var(--soft)} .faint{fill:var(--faint)}
</style><rect width="800" height="350" fill="var(--bg)"/><g transform="rotate(-0.2 400.0 180.0)"><rect x="27" y="35" width="752" height="300" rx="3" fill="var(--shadow)"/><rect x="24" y="30" width="752" height="300" rx="3" fill="var(--paper)" stroke="var(--rule)"/></g><circle cx="62" cy="34" r="9" fill="var(--shadow)"/><circle cx="60" cy="30" r="9" fill="#b3372b"/><circle cx="57" cy="27" r="3" fill="#e8776b" opacity=".8"/><text x="60" y="76" class="mono" font-size="10.5" >THE SHORT VERSION · FOR SKIMMING</text><text x="60" y="116" class="serif" font-size="30" font-weight="500">Frontend / Product Engineer</text><text x="60" y="148" class="serif soft" font-size="15.5" >I build the product surfaces people actually touch — onboarding,</text><text x="60" y="170" class="serif" font-size="15.5" >performance, the checkout path — and instrument whether they got easier to use.</text><text x="60" y="208" class="mono" font-size="10.5" >STACK</text><rect x="60" y="220" width="62" height="24" rx="12" fill="none" stroke="var(--faint)" stroke-dasharray="3 2"/><text x="91.0" y="236.5" class="type" font-size="11.5" text-anchor="middle">React</text><rect x="130" y="220" width="78" height="24" rx="12" fill="none" stroke="var(--faint)" stroke-dasharray="3 2"/><text x="169.0" y="236.5" class="type" font-size="11.5" text-anchor="middle">Next.js</text><rect x="216" y="220" width="78" height="24" rx="12" fill="none" stroke="var(--faint)" stroke-dasharray="3 2"/><text x="255.0" y="236.5" class="type" font-size="11.5" text-anchor="middle">Flutter</text><rect x="302" y="220" width="70" height="24" rx="12" fill="none" stroke="var(--faint)" stroke-dasharray="3 2"/><text x="337.0" y="236.5" class="type" font-size="11.5" text-anchor="middle">Vue js</text><rect x="380" y="220" width="102" height="24" rx="12" fill="none" stroke="var(--faint)" stroke-dasharray="3 2"/><text x="431.0" y="236.5" class="type" font-size="11.5" text-anchor="middle">TypeScript</text><rect x="490" y="220" width="78" height="24" rx="12" fill="none" stroke="var(--faint)" stroke-dasharray="3 2"/><text x="529.0" y="236.5" class="type" font-size="11.5" text-anchor="middle">GraphQL</text><rect x="576" y="220" width="86" height="24" rx="12" fill="none" stroke="var(--faint)" stroke-dasharray="3 2"/><text x="619.0" y="236.5" class="type" font-size="11.5" text-anchor="middle">Tailwind</text><rect x="670" y="220" width="62" height="24" rx="12" fill="none" stroke="var(--faint)" stroke-dasharray="3 2"/><text x="701.0" y="236.5" class="type" font-size="11.5" text-anchor="middle">CI/CD</text><rect x="60" y="254" width="46" height="24" rx="12" fill="none" stroke="var(--faint)" stroke-dasharray="3 2"/><text x="83.0" y="270.5" class="type" font-size="11.5" text-anchor="middle">Git</text><rect x="114" y="254" width="126" height="24" rx="12" fill="none" stroke="var(--faint)" stroke-dasharray="3 2"/><text x="177.0" y="270.5" class="type" font-size="11.5" text-anchor="middle">Redux/Zustand</text><rect x="248" y="254" width="46" height="24" rx="12" fill="none" stroke="var(--faint)" stroke-dasharray="3 2"/><text x="271.0" y="270.5" class="type" font-size="11.5" text-anchor="middle">AWS</text><rect x="302" y="254" width="70" height="24" rx="12" fill="none" stroke="var(--faint)" stroke-dasharray="3 2"/><text x="337.0" y="270.5" class="type" font-size="11.5" text-anchor="middle">Docker</text><text x="60" y="300" class="hand" font-size="18" textLength="560" lengthAdjust="spacingAndGlyphs">→ 3.4 → 58 orders/day (17×) in 8 weeks · +35% Core Web Vitals</text></svg>